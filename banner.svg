<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nouveau Paint Local</title>
  <desc id="desc">Bannière GitHub pour un éditeur d’images local type Paint avancé</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.48" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 80) rotate(35) scale(420 220)">
      <stop stop-color="#93C5FD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 330) rotate(15) scale(520 250)">
      <stop stop-color="#A7F3D0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="34" fill="url(#glow1)"/>
  <rect width="1400" height="420" rx="34" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1398" height="418" rx="33" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <rect width="1400" height="420" rx="34" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="905" y="72" width="350" height="252" rx="30" fill="#F8FAFC"/>
    <rect x="930" y="98" width="300" height="200" rx="22" fill="#E0F2FE"/>
    <rect x="958" y="128" width="96" height="64" rx="16" fill="#38BDF8"/>
    <rect x="1072" y="128" width="126" height="18" rx="9" fill="#0F172A" fill-opacity="0.22"/>
    <rect x="1072" y="158" width="94" height="18" rx="9" fill="#0F172A" fill-opacity="0.14"/>
    <path d="M957 262C1006 211 1029 211 1067 249C1085 267 1102 269 1122 251C1148 227 1177 224 1201 261V278H957V262Z" fill="#1D4ED8"/>
    <circle cx="1168" cy="202" r="22" fill="#FACC15"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="818" y="238" width="170" height="92" rx="24" fill="#FFFFFF" fill-opacity="0.96"/>
    <path d="M854 290C876 260 902 258 922 287C937 309 959 305 972 282" stroke="#0EA5E9" stroke-width="12" stroke-linecap="round"/>
    <rect x="848" y="262" width="74" height="14" rx="7" fill="#0F172A" fill-opacity="0.16"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="1116" y="290" width="130" height="74" rx="22" fill="#FFFFFF" fill-opacity="0.96"/>
    <path d="M1143 329C1160 309 1175 349 1191 324C1202 306 1215 334 1227 315" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g opacity="0.9">
    <circle cx="1260" cy="93" r="9" fill="#A7F3D0"/>
    <circle cx="1302" cy="137" r="7" fill="#BFDBFE"/>
    <circle cx="1203" cy="48" r="6" fill="#FDE68A"/>
    <circle cx="836" cy="64" r="6" fill="#FCA5A5"/>
  </g>

  <g>
    <text x="96" y="142" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="4">
      ÉDITEUR D’IMAGES LOCAL
    </text>
    <text x="96" y="218" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">
      Nouveau Paint Local
    </text>
    <text x="100" y="266" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500">
      Compose, annote, recadre et exporte tes images directement dans le navigateur.
    </text>

    <g transform="translate(96 306)">
      <rect width="160" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="24" y="28" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">100% local</text>

      <rect x="178" width="182" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="202" y="28" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Sans serveur</text>

      <rect x="378" width="194" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="402" y="28" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Mini Paint avancé</text>
    </g>
  </g>
</svg>
